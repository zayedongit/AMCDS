# ============================================================
# AMCDS - Autonomous Multi-Agent Cyber Defense System
# Docker Compose Configuration
# ============================================================
# Run: docker-compose up
# Reset: docker-compose down -v
# ============================================================

services:
  # --- Apache Kafka (KRaft mode, no Zookeeper) ---
  kafka:
    image: apache/kafka:latest
    container_name: amcds-kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx768m -Xms512m}
      CLUSTER_ID: "amcds-kafka-cluster-001"
    volumes:
      - kafka_data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 1536M
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - amcds-net

  # --- PostgreSQL ---
  postgres:
    build:
      context: ./database/postgres
      dockerfile: Dockerfile
    container_name: amcds-postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amcds}
      POSTGRES_USER: ${POSTGRES_USER:-amcds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amcds_secure_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amcds} -d ${POSTGRES_DB:-amcds}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - amcds-net

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: amcds-redis
    hostname: redis
    ports:
      - "6379:6379"
    volumes:
      - ./database/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amcds-net

  # --- Neo4j Community ---
  neo4j:
    image: neo4j:5-community
    container_name: amcds-neo4j
    hostname: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/amcds_graph_2024}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./database/neo4j/init.cypher:/var/lib/neo4j/import/init.cypher
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - amcds-net

  # --- AMCDS Simulation Engine (Ray + Agents) ---
  amcds-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amcds-engine
    hostname: amcds-engine
    ports:
      - "8000:8000"
      - "8265:8265"
    environment:
      SIM_SEED: ${SIM_SEED:-42}
      SIM_TICK_INTERVAL_MS: ${SIM_TICK_INTERVAL_MS:-100}
      SIM_NUM_USERS: ${SIM_NUM_USERS:-100}
      SIM_NUM_HOSTS: ${SIM_NUM_HOSTS:-100}
      SIM_NUM_SERVICES: ${SIM_NUM_SERVICES:-10}
      SIM_NUM_SUBNETS: ${SIM_NUM_SUBNETS:-5}
      SIM_SCENARIO: ${SIM_SCENARIO:-baseline_medium}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-amcds}
      POSTGRES_USER: ${POSTGRES_USER:-amcds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amcds_secure_2024}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NEO4J_HOST: neo4j
      NEO4J_BOLT_PORT: 7687
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/amcds_graph_2024}
      RAY_OBJECT_STORE_MEMORY: ${RAY_OBJECT_STORE_MEMORY:-536870912}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    shm_size: "2g"
    deploy:
      resources:
        limits:
          memory: 4096M
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - amcds-net

  # --- Attack Simulation Engine ---
  amcds-attack:
    build:
      context: .
      dockerfile: Dockerfile.attack
    container_name: amcds-attack
    hostname: amcds-attack
    environment:
      SIM_SEED: ${SIM_SEED:-42}
      SIM_SCENARIO: ${SIM_SCENARIO:-baseline_medium}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    deploy:
      resources:
        limits:
          memory: 1536M
    depends_on:
      kafka:
        condition: service_healthy
      amcds-engine:
        condition: service_started
    networks:
      - amcds-net

  # --- Dashboard Backend (FastAPI) ---
  dashboard-backend:
    build:
      context: ./dashboard/backend
      dockerfile: Dockerfile
    container_name: amcds-dashboard-backend
    hostname: dashboard-backend
    ports:
      - "8080:8080"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8080
      API_WORKERS: 2
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-amcds}
      POSTGRES_USER: ${POSTGRES_USER:-amcds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amcds_secure_2024}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NEO4J_HOST: neo4j
      NEO4J_BOLT_PORT: 7687
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/amcds_graph_2024}
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - amcds-net

  # --- Dashboard Frontend (Next.js) ---
  dashboard-frontend:
    build:
      context: ./dashboard/frontend
      dockerfile: Dockerfile
    container_name: amcds-dashboard-frontend
    hostname: dashboard-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws/events}
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - dashboard-backend
    networks:
      - amcds-net

volumes:
  kafka_data:
  postgres_data:
  neo4j_data:
  neo4j_logs:

networks:
  amcds-net:
    driver: bridge
